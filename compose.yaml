services:
  db:
    image: paradedb/paradedb:0.26.0-pg17
    command: ["postgres", "-c", "shared_preload_libraries=pg_search"]
    environment:
      POSTGRES_DB: springrag
      POSTGRES_USER: springrag
      POSTGRES_PASSWORD: springrag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
