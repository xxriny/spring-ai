name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B -pl backend test
      - run: mvn -B -pl backend -Dtest=VisitorDaoIT,JdbcRetrievalDaoIT test

  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install 'pdfplumber>=0.11,<0.12'
      - run: python -m unittest discover -s infrastructure/ocr -p 'test_*.py'
      - run: python -m unittest discover -s infrastructure/reranker -p 'test_*.py'

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: node --test test/*.test.mjs
      - run: npm run build
      - run: VITE_PUBLIC_DEMO=true npm run build

  images:
    needs: [backend, python, frontend, compose]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: asia-northeast3-docker.pkg.dev/spring-rag-demo/spring-rag/${{ matrix.name }}:${{ github.sha }}
    strategy:
      matrix:
        include:
          - name: backend
            context: backend
          - name: reranker
            context: infrastructure/reranker
          - name: ocr
            context: infrastructure/ocr
          - name: web
            context: frontend
    steps:
      - uses: actions/checkout@v7
      - run: docker build --platform linux/amd64 --build-arg VITE_PUBLIC_DEMO=true -t "$IMAGE" ${{ matrix.context }}
      - id: auth
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_IMAGE_PUBLISHER }}
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: asia-northeast3-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push "$IMAGE"

  compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: docker compose --env-file infrastructure/deploy/.env.example -f infrastructure/deploy/compose.yaml config -q
