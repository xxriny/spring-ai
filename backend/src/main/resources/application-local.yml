spring:
  autoconfigure.exclude: org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiEmbeddingConnectionAutoConfiguration
  ai:
    model.chat: ollama
    model.embedding: ollama
    model.embedding.text: none
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://127.0.0.1:11434}
      chat:
        model: ${OLLAMA_CHAT_MODEL:qwen3.5:9b}
        num-ctx: 8192
        think: false
      embedding.model: qwen3-embedding:8b
app:
  embedding-model-id: ${spring.ai.ollama.embedding.model}/1536
